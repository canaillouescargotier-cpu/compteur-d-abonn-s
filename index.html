<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Abonnés YouTube</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Bulles lumineuses d'arrière-plan */
        .bubble {
            position: absolute;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-15px) scale(1.05); opacity: 1; }
        }

        /* Carte principale style glassmorphism */
        .widget-card {
            background: rgba(18, 30, 49, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px 28px;
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            width: 280px;
            z-index: 10;
        }

        .channel-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .channel-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Badge En direct */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
        }

        .subscriber-count {
            font-size: 40px;
            font-weight: 700;
            margin: 5px 0;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a99ad;
            margin-bottom: 20px;
        }

        /* Barre d'objectif */
        .goal-container {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .goal-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 500;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            height: 100%;
            width: 14%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- Bulles décoratives en arrière-plan -->
    <div class="bubble" style="width: 50px; height: 50px; top: 20%; left: 25%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; bottom: 25%; right: 28%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 70px; height: 70px; top: 65%; left: 15%; animation-delay: 4s;"></div>

    <div class="widget-card">
        <div class="channel-name">@flexplay_officiel</div>
        
        <div>
            <span class="live-badge">
                <span class="live-dot"></span> En direct
            </span>
        </div>

        <div class="subscriber-count" id="subCount">2 144</div>
        <div class="label">Abonnés YouTube</div>
        
        <div class="goal-container">
            <div class="goal-info">
              <span>Objectif : 3 000</span>
              <span>14%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

</body>
</html>
