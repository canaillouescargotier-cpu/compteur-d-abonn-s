<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur d'abonnés YouTube - @flexplay_officiel</title>

  <!-- Library pour les confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      /* Superbe fond bleu dégradé */
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 60px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .yt-logo {
      width: 70px;
      height: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      margin: 10px 0;
      color: #e0f7fa;
    }

    .counter {
      font-size: 5.5rem;
      font-weight: 900;
      color: #90e0ef;
      margin: 20px 0;
      text-shadow: 0 0 25px rgba(144, 224, 239, 0.6);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .counter.bump {
      transform: scale(1.15);
    }

    .sub-text {
      font-size: 1.2rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #90e0ef;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>

    <h1>@flexplay_officiel</h1>
    <div class="counter" id="subscriber-count">0</div>
    <div class="sub-text">Abonnés YouTube</div>
    <div class="status" id="status-text">Chargement...</div>
  </div>

  <script>
    const CHANNEL_ID = 'UCcDHC9MCUe2-5z_vNUzyXEQ'; 
    let previousCount = null;
    let displayedCount = 0;
    let animationInterval = null;

    // Animation fluide pour faire défiler le chiffre
    function animateCounter(targetValue) {
      const counterEl = document.getElementById('subscriber-count');
      
      if (animationInterval) clearInterval(animationInterval);

      const startValue = displayedCount;
      const duration = 1200; // Durée de l'animation en millisecondes
      const frameRate = 30;
      const totalFrames = Math.round(duration / (1000 / frameRate));
      let currentFrame = 0;

      animationInterval = setInterval(() => {
        currentFrame++;
        const progress = currentFrame / totalFrames;
        // Effet de ralentissement progressif (ease-out)
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        
        displayedCount = Math.round(startValue + (targetValue - startValue) * easeProgress);
        counterEl.textContent = displayedCount.toLocaleString('fr-FR');

        if (currentFrame >= totalFrames) {
          clearInterval(animationInterval);
          displayedCount = targetValue;
          counterEl.textContent = targetValue.toLocaleString('fr-FR');
        }
      }, 1000 / frameRate);
    }

    async function fetchSubscribers() {
      const statusElement = document.getElementById('status-text');
      const counterEl = document.getElementById('subscriber-count');

      try {
        const response = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${CHANNEL_ID}`);
        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        
        if (data && data.counts && data.counts[0] && data.counts[0].count !== undefined) {
          const currentCount = parseInt(data.counts[0].count);

          statusElement.textContent = "En direct";

          // Animation du chiffre
          animateCounter(currentCount);

          // Confettis dès qu'il y a au moins un abonné de plus !
          if (previousCount !== null && currentCount > previousCount) {
            launchConfetti();
            
            // Effet d'agrandissement temporaire sur le nombre
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 300);
          }

          previousCount = currentCount;
        } else {
          throw new Error("Données indisponibles");
        }

      } catch (err) {
        console.error("Erreur :", err);
        statusElement.textContent = "Recherche en cours...";
      }
    }

    function launchConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // Premier appel puis actualisation toutes les 5 secondes
    fetchSubscribers();
    setInterval(fetchSubscribers, 5000);
  </script>
</body>
</html>
