<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Live YouTube</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .widget-container {
            background: rgba(20, 30, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            width: 300px;
        }
        .channel-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .subscriber-count {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .chat-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
        }
        .chat-message {
            margin-bottom: 6px;
            word-break: break-word;
        }
        .chat-user {
            font-weight: bold;
            color: #4facfe;
        }
    </style>
</head>
