<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Abonnés & Chat YouTube</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Bulles lumineuses d'arrière-plan */
        .bubble {
            position: absolute;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-15px) scale(1.05); opacity: 1; }
        }

        /* Carte principale style glassmorphism */
        .widget-card {
            background: rgba(18, 30, 49, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px 28px;
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            width: 300px;
            z-index: 10;
        }

        .channel-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        /* Badge En direct */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
        }

        .subscriber-count {
            font-size: 40px;
            font-weight: 700;
            margin: 5px 0;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a99ad;
            margin-bottom: 15px;
        }

        /* Barre d'objectif */
        .goal-container {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .goal-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 500;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Zone de chat en direct */
        .chat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 8px;
            max-height: 90px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-message {
            margin-bottom: 4px;
            word-break: break-word;
        }

        .chat-user {
            font-weight: bold;
            color: #00c6ff;
        }
    </style>
</head>
<body>

    <!-- Bulles décoratives d'arrière-plan -->
    <div class="bubble" style="width: 50px; height: 50px; top: 20%; left: 25%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; bottom: 25%; right: 28%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 70px; height: 70px; top: 65%; left: 15%; animation-delay: 4s;"></div>

    <div class="widget-card">
        <div class="channel-name">@flexplay_officiel</div>
        
        <div>
            <span class="live-badge">
                <span class="live-dot"></span> En direct
            </span>
        </div>

        <div class="subscriber-count" id="subCount">...</div>
        <div class="label">Abonnés YouTube</div>
        
        <div class="goal-container">
            <div class="goal-info">
              <span>Objectif : 3 000</span>
              <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Mini chat en direct -->
        <div class="chat-box" id="chatBox">
            <div class="chat-message"><span class="chat-user">Système :</span> Prêt pour le live...</div>
        </div>
    </div>

    <script>
        // === LA MÉMOIRE AUTOMATIQUE (LocalStorage) ===
        // Si la clé ou l'ID sont déjà enregistrés, il les récupère tout seul. 
        // Sinon, tu les mets une seule fois ici :
        let CHANNEL_ID = localStorage.getItem('yt_channel_id') || "TON_ID_UC_ICI";
        let API_KEY = localStorage.getItem('yt_api_key') || "TA_CLE_API_ICI";

        // Sauvegarde automatique dans le navigateur pour ne plus jamais avoir à les réécrire
        localStorage.setItem('yt_channel_id', CHANNEL_ID);
        localStorage.setItem('yt_api_key', API_KEY);
        // =============================================

        let liveChatId = null;
        let lastMessageTime = null;

        // 1. Récupération des abonnés
        async function fetchSubscriberCount() {
            try {
                const response = await fetch(`https://api.socialcounts.org/youtube-live-subscriber-count/${CHANNEL_ID}`);
                const data = await response.json();
                
                if (data && data.subcounts && data.subcounts.length > 0) {
                    const count = data.subcounts[data.subcounts.length - 1].count;
                    document.getElementById('subCount').innerText = count.toLocaleString('fr-FR');
                    
                    const goal = 3000;
                    let percentage = Math.min(Math.floor((count / goal) * 100), 100);
                    document.getElementById('progressText').innerText = percentage + '%';
                    document.getElementById('progressBar').style.width = percentage + '%';
                }
            } catch (error) {
                console.error("Erreur abonnés :", error);
            }
        }

        // 2. Détection du live en cours
        async function findActiveLiveChat() {
            if (!API_KEY || API_KEY === "TA_CLE_API_ICI" || !CHANNEL_ID || CHANNEL_ID === "TON_ID_UC_ICI") return;
            
            try {
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=live&key=${API_KEY}`;
                const response = await fetch(searchUrl);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const videoId = data.items[0].id.videoId;
                    
                    const videoUrl = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${API_KEY}`;
                    const videoResponse = await fetch(videoUrl);
                    const videoData = await videoResponse.json();

                    if (videoData.items && videoData.items[0].liveStreamingDetails) {
                        liveChatId = videoData.items[0].liveStreamingDetails.activeLiveChatId;
                        document.getElementById('chatBox').innerHTML = `<div class="chat-message"><span class="chat-user">Système :</span> Chat connecté !</div>`;
                        fetchLiveChatMessages();
                    }
                } else {
                    document.getElementById('chatBox').innerHTML = `<div class="chat-message"><span class="chat-user">Système :</span> Aucun live détecté.</div>`;
                }
            } catch (error) {
                console.error("Erreur recherche live :", error);
            }
        }

        // 3. Messages du chat
        async function fetchLiveChatMessages() {
            if (!liveChatId) return;

            try {
                const chatUrl = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&key=${API_KEY}`;
                const response = await fetch(chatUrl);
                const data = await response.json();

                if (data.items) {
                    const chatBox = document.getElementById('chatBox');
                    
                    data.items.forEach(item => {
                        const messageTime = new Date(item.snippet.publishedAt).getTime();
                        
                        if (!lastMessageTime || messageTime > lastMessageTime) {
                            const author = item.authorDetails.displayName;
                            const message = item.snippet.displayMessage;

                            const msgElement = document.createElement('div');
                            msgElement.className = 'chat-message';
                            msgElement.innerHTML = `<span class="chat-user">${author} :</span> ${message}`;
                            
                            chatBox.appendChild(msgElement);
                            chatBox.scrollTop = chatBox.scrollHeight;
                            
                            lastMessageTime = messageTime;
                        }
                    });
                }
            } catch (error) {
                console.error("Erreur messages chat :", error);
            }
        }

        fetchSubscriberCount();
        setInterval(fetchSubscriberCount, 5000);

        findActiveLiveChat();
        setInterval(findActiveLiveChat, 60000);
        setInterval(fetchLiveChatMessages, 5000);
    </script>
</body>
</html>
