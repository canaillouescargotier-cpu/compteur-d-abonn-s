<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur d'abonnés YouTube - @flexplay_officiel</title>

  <!-- Script pour les confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Super dégradé de fonds bleus */
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 60px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 450px;
      width: 100%;
    }

    .yt-logo {
      width: 70px;
      height: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 5px 0;
      color: #e0f7fa;
      font-weight: 700;
    }

    .status {
      font-size: 0.9rem;
      color: #90e0ef;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .counter {
      font-size: 5.5rem;
      font-weight: 900;
      color: #90e0ef;
      margin: 15px 0;
      text-shadow: 0 0 25px rgba(144, 224, 239, 0.6);
      transition: transform 0.2s ease;
      display: inline-block;
      line-height: 1;
    }

    .counter.bump {
      transform: scale(1.15);
    }

    .sub-text {
      font-size: 1.2rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    /* Section Objectif */
    .goal-section {
      background: rgba(0, 0, 0, 0.2);
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #caf0f8;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .goal-percentage {
      color: #48cae4;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .goal-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      height: 14px;
      width: 100%;
      overflow: hidden;
    }

    .goal-bar-fill {
      background: linear-gradient(90deg, #48cae4, #00b4d8);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>

    <h1>@flexplay_officiel</h1>
    <div class="status" id="status-text">● En direct</div>

    <div class="counter" id="subscriber-count">0</div>
    <div class="sub-text">Abonnés YouTube</div>

    <!-- OBJECTIF DYNAMIQUE -->
    <div class="goal-section">
      <div class="goal-header">
        <span>Objectif : <strong id="next-goal">3 000</strong></span>
        <span class="goal-percentage" id="goal-percentage">0%</span>
      </div>
      <div class="goal-bar-bg">
        <div class="goal-bar-fill" id="goal-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_ID = 'UCcDHC9MCUe2-5z_vNUzyXEQ'; 
    
    let previousCount = null;
    let displayedCount = 0;
    let animationInterval = null;

    // Animation fluide des chiffres
    function animateCounter(targetValue) {
      const counterEl = document.getElementById('subscriber-count');
      if (animationInterval) clearInterval(animationInterval);

      const startValue = displayedCount;
      const duration = 1000;
      const frameRate = 30;
      const totalFrames = Math.round(duration / (1000 / frameRate));
      let currentFrame = 0;

      animationInterval = setInterval(() => {
        currentFrame++;
        const progress = currentFrame / totalFrames;
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        
        displayedCount = Math.round(startValue + (targetValue - startValue) * easeProgress);
        counterEl.textContent = displayedCount.toLocaleString('fr-FR');

        if (currentFrame >= totalFrames) {
          clearInterval(animationInterval);
          displayedCount = targetValue;
          counterEl.textContent = targetValue.toLocaleString('fr-FR');
        }
      }, 1000 / frameRate);
    }

    // Calcul dynamique du palier d'objectif (3000, 4000, 5000...)
    function updateGoal(count) {
      // Détermine le prochain palier de 1000, avec un minimum à 3000
      let nextMilestone = Math.ceil((count + 1) / 1000) * 1000;
      if (nextMilestone < 3000) {
        nextMilestone = 3000;
      }

      const previousMilestone = nextMilestone - 1000;
      
      // Calcul du pourcentage entre le dernier palier et le prochain
      let progress = ((count - previousMilestone) / (nextMilestone - previousMilestone)) * 100;
      if (progress < 0) progress = (count / nextMilestone) * 100;

      document.getElementById('next-goal').textContent = nextMilestone.toLocaleString('fr-FR');
      document.getElementById('goal-percentage').textContent = `${Math.round(progress)}%`;
      document.getElementById('goal-bar').style.width = `${Math.min(100, Math.max(0, progress))}%`;
    }

    // Récupération des données YouTube
    async function fetchSubscribers() {
      const counterEl = document.getElementById('subscriber-count');

      try {
        const response = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${CHANNEL_ID}`);
        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        
        if (data && data.counts && data.counts[0] && data.counts[0].count !== undefined) {
          const currentCount = parseInt(data.counts[0].count);

          animateCounter(currentCount);
          updateGoal(currentCount);

          // Confettis dès qu'un abonné rejoint la chaîne
          if (previousCount !== null && currentCount > previousCount) {
            launchConfetti();
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 300);
          }

          previousCount = currentCount;
        }
      } catch (err) {
        console.error("Erreur de récupération :", err);
      }
    }

    function launchConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // Premier chargement puis actualisation toutes les 5 secondes
    fetchSubscribers();
    setInterval(fetchSubscribers, 5000);
  </script>
</body>
</html>
