<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Abonnés YouTube</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Bulles lumineuses animées en arrière-plan */
        .bubble {
            position: absolute;
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-15px) scale(1.05); opacity: 1; }
        }

        /* Carte principale style glassmorphism */
        .widget-card {
            background: rgba(18, 30, 49, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px 28px;
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            width: 300px;
            z-index: 10;
        }

        .channel-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        /* Badge En direct */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
        }

        .subscriber-count {
            font-size: 40px;
            font-weight: 700;
            margin: 5px 0;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a99ad;
            margin-bottom: 15px;
        }

        /* Barre d'objectif */
        .goal-container {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .goal-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 500;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Zone de chat en direct */
        .chat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 8px;
            max-height: 90px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-message {
            margin-bottom: 4px;
            word-break: break-word;
        }

        .chat-user {
            font-weight: bold;
            color: #00c6ff;
        }
    </style>
</head>
<body>

    <!-- Bulles décoratives animées en arrière-plan -->
    <div class="bubble" style="width: 50px; height: 50px; top: 20%; left: 25%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; bottom: 25%; right: 28%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 70px; height: 70px; top: 65%; left: 15%; animation-delay: 4s;"></div>

    <div class="widget-card">
        <div class="channel-name">@flexplay_officiel</div>
        
        <div>
            <span class="live-badge">
                <span class="live-dot"></span> En direct
            </span>
        </div>

        <div class="subscriber-count" id="subCount">...</div>
        <div class="label">Abonnés YouTube</div>
        
        <div class="goal-container">
            <div class="goal-info">
              <span>Objectif : 3 000</span>
              <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Mini chat en direct -->
        <div class="chat-box" id="chatBox">
            <div class="chat-message"><span class="chat-user">Système :</span> Prêt pour le live...</div>
        </div>
    </div>

    <script>
        // === TES INFORMATIONS ENREGISTRÉES ===
        const CHANNEL_ID = "TON_ID_UC_ICI"; // Remets ton ID UC... ici
        const API_KEY = "TA_CLE_API_ICI";       // Ta clé API Google Cloud est enregistrée ici
        // =====================================

        async function fetchSubscriberCount() {
            try {
                const response = await fetch(`https://api.socialcounts.org/youtube-live-subscriber-count/${CHANNEL_ID}`);
                const data = await response.json();
                
                if (data && data.subcounts && data.subcounts.length > 0) {
                    const count = data.subcounts[data.subcounts.length - 1].count;
                    document.getElementById('subCount').innerText = count.toLocaleString('fr-FR');
                    
                    const goal = 3000;
                    let percentage = Math.min(Math.floor((count / goal) * 100), 100);
                    document.getElementById('progressText').innerText = percentage + '%';
                    document.getElementById('progressBar').style.width = percentage + '%';
                }
            } catch (error) {
                console.error("Erreur abonnés :", error);
            }
        }

        // Lancer la récupération des abonnés en temps réel
        fetchSubscriberCount();
        setInterval(fetchSubscriberCount, 5000);
    </script>
</body>
</html>
