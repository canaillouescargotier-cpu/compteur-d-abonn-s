<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Analytics Pro - @flexplay_officiel</title>

  <!-- Librairie Confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Librairie Chart.js pour les graphiques -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1300px;
      align-items: stretch;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .card.main {
      padding: 35px 25px;
      transform: scale(1.02);
      border: 2px solid rgba(144, 224, 239, 0.4);
    }

    h1 {
      font-size: 1.8rem;
      color: #e0f7fa;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #caf0f8;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
    }

    .yt-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
    }

    .counter {
      font-size: 4.8rem;
      font-weight: 900;
      color: #90e0ef;
      margin: 10px 0;
      text-shadow: 0 0 25px rgba(144, 224, 239, 0.6);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .counter.bump {
      transform: scale(1.15);
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #48cae4;
      margin-top: 2px;
    }

    .metric-label {
      font-size: 0.85rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Barre d'objectif */
    .goal-container {
      margin-top: 15px;
      text-align: left;
    }

    .goal-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin-top: 5px;
    }

    .goal-bar-fill {
      background: linear-gradient(90deg, #48cae4, #00b4d8);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Badge Live */
    .live-badge {
      display: inline-block;
      background: #e63946;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .chart-box {
      position: relative;
      height: 150px;
      width: 100%;
      margin-top: 10px;
    }

    .status {
      font-size: 0.85rem;
      color: #90e0ef;
      opacity: 0.9;
    }

    @media (max-width: 950px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .card.main {
        transform: scale(1);
        order: -1;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- CÔTÉ GAUCHE : ANALYTICS HISTORIQUE -->
    <div class="card">
      <h2>Analytics Chaîne</h2>

      <div class="metric-box">
        <div class="metric-label">Vues Totales</div>
        <div class="metric-value" id="total-views">...</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Vidéos Publiées</div>
        <div class="metric-value" id="total-videos">...</div>
      </div>

      <div class="metric-label" style="margin-top: 5px;">Graphique de Croissance</div>
      <div class="chart-box">
        <canvas id="growthChart"></canvas>
      </div>
    </div>

    <!-- CENTRE : COMPTEUR EN DIRECT -->
    <div class="card main">
      <div>
        <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <h1>@flexplay_officiel</h1>
        <div class="status" id="status-text">● En direct</div>
      </div>

      <div>
        <div class="counter" id="subscriber-count">0</div>
        <div class="metric-label">Abonnés YouTube</div>
      </div>

      <!-- Objectif Palier -->
      <div class="goal-container">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#caf0f8;">
          <span>Objectif : <strong id="next-goal">1 000</strong></span>
          <span id="goal-percentage">0%</span>
        </div>
        <div class="goal-bar-bg">
          <div class="goal-bar-fill" id="goal-bar"></div>
        </div>
      </div>
    </div>

    <!-- CÔTÉ DROIT : LIVE ANALYTICS -->
    <div class="card">
      <div>
        <h2>Live Analytics</h2>
        <div class="live-badge">Session En Direct</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Gagnés cette session</div>
        <div class="metric-value" id="session-gained">+0</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Vitesse de croissance</div>
        <div class="metric-value" id="growth-rate">0 / heure</div>
      </div>

      <div class="metric-label">Activité du Live</div>
      <div class="chart-box">
        <canvas id="liveChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const CHANNEL_ID = 'UCcDHC9MCUe2-5z_vNUzyXEQ'; 
    
    let previousCount = null;
    let initialSessionCount = null;
    let displayedCount = 0;
    let animationInterval = null;
    let startTime = Date.now();

    // Setup des Graphiques Chart.js
    const chartConfig = {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: '#48cae4',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          backgroundColor: 'rgba(72, 202, 228, 0.1)',
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { display: false }
        }
      }
    };

    const growthChart = new Chart(document.getElementById('growthChart').getContext('2d'), JSON.parse(JSON.stringify(chartConfig)));
    
    // Graphique Live avec couleur rouge/rose
    const liveConfig = JSON.parse(JSON.stringify(chartConfig));
    liveConfig.data.datasets[0].borderColor = '#ff4d6d';
    liveConfig.data.datasets[0].backgroundColor = 'rgba(255, 77, 109, 0.15)';
    const liveChart = new Chart(document.getElementById('liveChart').getContext('2d'), liveConfig);

    // Animation fluide des chiffres
    function animateCounter(targetValue) {
      const counterEl = document.getElementById('subscriber-count');
      if (animationInterval) clearInterval(animationInterval);

      const startValue = displayedCount;
      const duration = 1000;
      const frameRate = 30;
      const totalFrames = Math.round(duration / (1000 / frameRate));
      let currentFrame = 0;

      animationInterval = setInterval(() => {
        currentFrame++;
        const progress = currentFrame / totalFrames;
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        
        displayedCount = Math.round(startValue + (targetValue - startValue) * easeProgress);
        counterEl.textContent = displayedCount.toLocaleString('fr-FR');

        if (currentFrame >= totalFrames) {
          clearInterval(animationInterval);
          displayedCount = targetValue;
          counterEl.textContent = targetValue.toLocaleString('fr-FR');
        }
      }, 1000 / frameRate);
    }

    // Mise à jour de la barre d'objectif
    function updateGoal(count) {
      // Calcule le prochain palier (ex: 1000, 2000, etc.)
      const nextMilestone = Math.ceil((count + 1) / 1000) * 1000;
      const previousMilestone = nextMilestone - 1000;
      
      const progress = ((count - previousMilestone) / (nextMilestone - previousMilestone)) * 100;
      
      document.getElementById('next-goal').textContent = nextMilestone.toLocaleString('fr-FR');
      document.getElementById('goal-percentage').textContent = `${Math.round(progress)}%`;
      document.getElementById('goal-bar').style.width = `${Math.min(100, Math.max(0, progress))}%`;
    }

    // Mise à jour des Analytics de la session Live
    function updateLiveAnalytics(currentCount) {
      if (initialSessionCount === null) {
        initialSessionCount = currentCount;
      }

      // Gain pendant la session
      const gained = currentCount - initialSessionCount;
      document.getElementById('session-gained').textContent = (gained >= 0 ? '+' : '') + gained.toLocaleString('fr-FR');

      // Vitesse par heure
      const hoursPassed = (Date.now() - startTime) / (1000 * 60 * 60);
      const rate = hoursPassed > 0 ? Math.round(gained / hoursPassed) : 0;
      document.getElementById('growth-rate').textContent = `${rate >= 0 ? '+' : ''}${rate} / h`;
    }

    // Fonction principale de récupération des données
    async function fetchAllAnalytics() {
      const counterEl = document.getElementById('subscriber-count');

      try {
        const response = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${CHANNEL_ID}`);
        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        
        if (data && data.counts) {
          const currentCount = parseInt(data.counts[0].count);

          // 1. Mise à jour compteur principal
          animateCounter(currentCount);
          updateGoal(currentCount);
          updateLiveAnalytics(currentCount);

          // 2. Confettis si nouvel abonné
          if (previousCount !== null && currentCount > previousCount) {
            launchConfetti();
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 300);
          }

          // 3. Graphiques en direct
          const timeLabel = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          // Ajouter point dans Graphique Chaîne
          growthChart.data.labels.push(timeLabel);
          growthChart.data.datasets[0].data.push(currentCount);
          if (growthChart.data.labels.length > 15) {
            growthChart.data.labels.shift();
            growthChart.data.datasets[0].data.shift();
          }
          growthChart.update();

          // Ajouter point dans Graphique Live
          liveChart.data.labels.push(timeLabel);
          liveChart.data.datasets[0].data.push(currentCount - initialSessionCount);
          if (liveChart.data.labels.length > 15) {
            liveChart.data.labels.shift();
            liveChart.data.datasets[0].data.shift();
          }
          liveChart.update();

          // 4. Stats globales
          if (data.counts[1]) document.getElementById('total-views').textContent = parseInt(data.counts[1].count).toLocaleString('fr-FR');
          if (data.counts[2]) document.getElementById('total-videos').textContent = parseInt(data.counts[2].count).toLocaleString('fr-FR');

          previousCount = currentCount;
        }

      } catch (err) {
        console.error("Erreur Analytics :", err);
      }
    }

    function launchConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // Premier appel puis rafraîchissement toutes les 5 secondes
    fetchAllAnalytics();
    setInterval(fetchAllAnalytics, 5000);
  </script>
</body>
</html>
