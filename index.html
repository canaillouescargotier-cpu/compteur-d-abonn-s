<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur d'abonnés YouTube - @flexplay_officiel</title>

  <!-- Script pour les confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Fonds bleus en dégradé */
      background: linear-gradient(135deg, #0a1128, #001f54, #034078, #1282a2);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 50px 70px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .yt-icon {
      width: 60px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 10px 0;
      color: #caf0f8;
    }

    .counter {
      font-size: 5.5rem;
      font-weight: 800;
      color: #48cae4; /* Bleu vif */
      margin: 15px 0;
      text-shadow: 0 0 25px rgba(72, 202, 228, 0.6);
    }

    .sub-text {
      font-size: 1.3rem;
      color: #90e0ef;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo YouTube -->
    <svg class="yt-icon" viewBox="0 0 24 24" fill="#48cae4">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>
    
    <h1 id="username-display">@flexplay_officiel</h1>
    <div class="counter" id="follower-count">...</div>
    <div class="sub-text">Abonnés YouTube</div>
  </div>

  <script>
    const YOUTUBE_HANDLE = 'flexplay_officiel';
    let previousCount = null;

    async function fetchYouTubeSubscribers() {
      try {
        // Utilisation d'un service relais public pour récupérer le nombre réel d'abonnés YouTube
        const response = await fetch(`https://api.mico.icu/youtube/channel/get_subs?handle=${YOUTUBE_HANDLE}`);
        
        if (!response.ok) {
          // Secours si l'API principale est occupée
          const fallbackResponse = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/https://www.youtube.com/@${YOUTUBE_HANDLE}`);
          const fallbackData = await fallbackResponse.json();
          if (fallbackData && fallbackData.counts && fallbackData.counts[0]) {
            updateCount(parseInt(fallbackData.counts[0].count));
            return;
          }
          throw new Error('Impossible de charger les abonnés');
        }

        const data = await response.json();
        if (data && data.subscribers !== undefined) {
          updateCount(parseInt(data.subscribers));
        } else {
          throw new Error('Données invalides');
        }

      } catch (error) {
        console.error('Erreur :', error);
      }
    }

    function updateCount(currentCount) {
      document.getElementById('follower-count').textContent = currentCount.toLocaleString('fr-FR');

      // Déclenchement des confettis tous les 1000 abonnés
      if (previousCount !== null && previousCount !== currentCount) {
        const previousMilestone = Math.floor(previousCount / 1000);
        const currentMilestone = Math.floor(currentCount / 1000);

        if (currentMilestone > previousMilestone && currentMilestone > 0) {
          launchConfetti();
        }
      }

      previousCount = currentCount;
    }

    function launchConfetti() {
      confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
      });
    }

    // Récupération initiale puis mise à jour automatique toutes les 15 secondes
    fetchYouTubeSubscribers();
    setInterval(fetchYouTubeSubscribers, 15000);
  </script>
</body>
</html>
