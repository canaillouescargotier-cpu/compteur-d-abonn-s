<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexplay Live - Application Compteur</title>

  <!-- Meta PWA -->
  <meta name="theme-color" content="#03045e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flexplay Live">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png">

  <!-- Manifeste PWA -->
  <link rel="manifest" id="manifest-placeholder">

  <!-- Confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #02010a, #041230, #032b53, #005f73);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* BULLES EN FOND */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(144, 224, 239, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(144, 224, 239, 0.4);
      animation: rise 12s infinite linear;
    }

    .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; }
    .bubble:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 1s; }
    .bubble:nth-child(3) { left: 35%; width: 50px; height: 50px; animation-duration: 10s; animation-delay: 2s; }
    .bubble:nth-child(4) { left: 50%; width: 30px; height: 30px; animation-duration: 7s; animation-delay: 0s; }
    .bubble:nth-child(5) { left: 65%; width: 60px; height: 60px; animation-duration: 11s; animation-delay: 3s; }
    .bubble:nth-child(6) { left: 80%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 1s; }
    .bubble:nth-child(7) { left: 90%; width: 45px; height: 45px; animation-duration: 9s; animation-delay: 4s; }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }

    /* BANNIÈRE INSTALLATION */
    .install-banner {
      position: relative;
      z-index: 2;
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid rgba(0, 245, 212, 0.4);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.2);
    }

    .install-btn {
      background: #00f5d4;
      color: #02010a;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .install-btn:hover {
      transform: scale(1.05);
      background: #48cae4;
    }

    /* CARTE PRINCIPALE */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 45px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 460px;
      width: 100%;
    }

    .yt-logo {
      width: 75px;
      height: 75px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(144, 224, 239, 0.6));
    }

    h1 {
      font-size: 2.2rem;
      margin: 5px 0;
      color: #e0f7fa;
      font-weight: 800;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #90e0ef;
      background: rgba(0, 180, 216, 0.15);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(144, 224, 239, 0.3);
      margin-bottom: 15px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00f5d4;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f5d4;
    }

    .counter {
      font-size: 5.8rem;
      font-weight: 900;
      color: #90e0ef;
      margin: 10px 0;
      text-shadow: 0 0 30px rgba(144, 224, 239, 0.7);
      transition: transform 0.2s ease;
      display: inline-block;
      line-height: 1;
    }

    .counter.bump {
      transform: scale(1.2);
    }

    .sub-text {
      font-size: 1.1rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    /* BARRE D'OBJECTIF */
    .goal-section {
      background: rgba(0, 0, 0, 0.25);
      padding: 18px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #caf0f8;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .goal-percentage {
      color: #00f5d4;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .goal-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      height: 14px;
      width: 100%;
      overflow: hidden;
    }

    .goal-bar-fill {
      background: linear-gradient(90deg, #00b4d8, #00f5d4);
      height: 100%;
      width: 0%;
      transition: width 0.6s ease;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.5);
    }

    .manual-install-hint {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #90e0ef;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Bulles de fond -->
  <div class="bubbles-container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- Bannière d'installation -->
  <div class="install-banner" id="installBanner">
    <span>📲 Installer l'application <strong>Flexplay Live</strong></span>
    <button class="install-btn" id="installBtn">Installer</button>
  </div>

  <div class="card">
    <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>

    <h1>@flexplay_officiel</h1>
    <div class="status">
      <div class="status-dot"></div>
      <span>En direct</span>
    </div>

    <div class="counter" id="subscriber-count">0</div>
    <div class="sub-text">Abonnés YouTube</div>

    <!-- OBJECTIF DYNAMIQUE -->
    <div class="goal-section">
      <div class="goal-header">
        <span>Objectif : <strong id="next-goal">3 000</strong></span>
        <span class="goal-percentage" id="goal-percentage">0%</span>
      </div>
      <div class="goal-bar-bg">
        <div class="goal-bar-fill" id="goal-bar"></div>
      </div>
    </div>

    <div class="manual-install-hint" id="manualHint">
      Astuce : Tu peux aussi cliquer sur <strong>⋮ (ou le bouton Partager)</strong> puis <strong>"Ajouter à l'écran d'accueil"</strong> pour l'installer.
    </div>
  </div>

  <script>
    // --- SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW Erreur:', err));
    }

    // --- MANIFEST PWA ---
    const manifestData = {
      "name": "Flexplay Live",
      "short_name": "Flexplay",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#02010a",
      "theme_color": "#03045e",
      "icons": [
        {
          "src": "https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png",
          "sizes": "192x192",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // --- COMPTEUR YOUTUBE ---
    const CHANNEL_ID = 'UCcDHC9MCUe2-5z_vNUzyXEQ'; 
    let previousCount = null;
    let displayedCount = 0;
    let animationInterval = null;

    function animateCounter(targetValue) {
      const counterEl = document.getElementById('subscriber-count');
      if (animationInterval) clearInterval(animationInterval);

      const startValue = displayedCount;
      const duration = 1000;
      const frameRate = 30;
      const totalFrames = Math.round(duration / (1000 / frameRate));
      let currentFrame = 0;

      animationInterval = setInterval(() => {
        currentFrame++;
        const progress = currentFrame / totalFrames;
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        
        displayedCount = Math.round(startValue + (targetValue - startValue) * easeProgress);
        counterEl.textContent = displayedCount.toLocaleString('fr-FR');

        if (currentFrame >= totalFrames) {
          clearInterval(animationInterval);
          displayedCount = targetValue;
          counterEl.textContent = targetValue.toLocaleString('fr-FR');
        }
      }, 1000 / frameRate);
    }

    function updateGoal(count) {
      let nextMilestone = Math.ceil((count + 1) / 1000) * 1000;
      if (nextMilestone < 3000) {
        nextMilestone = 3000;
      }

      const previousMilestone = nextMilestone - 1000;
      
      let progress = ((count - previousMilestone) / (nextMilestone - previousMilestone)) * 100;
      if (progress < 0) progress = (count / nextMilestone) * 100;

      document.getElementById('next-goal').textContent = nextMilestone.toLocaleString('fr-FR');
      document.getElementById('goal-percentage').textContent = `${Math.round(progress)}%`;
      document.getElementById('goal-bar').style.width = `${Math.min(100, Math.max(0, progress))}%`;
    }

    async function fetchSubscribers() {
      const counterEl = document.getElementById('subscriber-count');

      try {
        const response = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${CHANNEL_ID}`);
        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        
        if (data && data.counts && data.counts[0] && data.counts[0].count !== undefined) {
          const currentCount = parseInt(data.counts[0].count);

          animateCounter(currentCount);
          updateGoal(currentCount);

          if (previousCount !== null && currentCount > previousCount) {
            launchConfetti();
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 300);
          }

          previousCount = currentCount;
        }
      } catch (err) {
        console.error("Erreur :", err);
      }
    }

    function launchConfetti() {
      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    fetchSubscribers();
    setInterval(fetchSubscribers, 5000);
  </script>
</body>
</html>
