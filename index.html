<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur d'abonnés YouTube - @flexplay_officiel</title>

  <!-- Script pour les confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Super dégradé de fonds bleus */
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 60px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 400px;
      width: 80%;
    }

    .yt-logo {
      width: 70px;
      height: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      margin: 10px 0 5px 0;
      color: #e0f7fa;
      font-weight: 700;
    }

    .counter {
      font-size: 5rem;
      font-weight: 900;
      color: #90e0ef; /* Bleu néon clair */
      margin: 20px 0;
      text-shadow: 0 0 20px rgba(144, 224, 239, 0.6);
      line-height: 1;
    }

    .sub-text {
      font-size: 1.2rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #90e0ef;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Icône YouTube personnalisée en bleu -->
    <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
    </svg>

    <h1 id="channel-name">@flexplay_officiel</h1>
    <div class="counter" id="subscriber-count">...</div>
    <div class="sub-text">Abonnés YouTube</div>
    <div class="status" id="status-text">Mise à jour...</div>
  </div>

  <script>
    const HANDLE = 'flexplay_officiel';
    let previousCount = null;

    async function fetchSubscribers() {
      const statusElement = document.getElementById('status-text');
      const countElement = document.getElementById('subscriber-count');

      try {
        // Lien YouTube vers ta chaîne
        const targetUrl = `https://www.youtube.com/@${HANDLE}`;
        // Passer par un proxy AllOrigins pour contourner le blocage CORS du navigateur
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Erreur réseau");

        const data = await response.json();
        const html = data.contents;

        // Recherche du nombre d'abonnés dans la page web YouTube
        const match = html.match(/"subscriberCountText":\{"accessibility":\{"accessibilityData":\{"label":"([^"]+)"\}/);
        
        if (match && match[1]) {
          const textLabel = match[1]; // Ex: "1,2k abonnés" ou "520 abonnés"
          
          // Extraire uniquement les chiffres pour le compteur
          const countNum = parseSubCount(textLabel);

          if (countNum !== null) {
            countElement.textContent = countNum.toLocaleString('fr-FR');
            statusElement.textContent = "En direct";

            // Déclencher les confettis tous les 1000 abonnés
            if (previousCount !== null && previousCount !== countNum) {
              const prevMilestone = Math.floor(previousCount / 1000);
              const currentMilestone = Math.floor(countNum / 1000);

              if (currentMilestone > prevMilestone && currentMilestone > 0) {
                launchConfetti();
              }
            }

            previousCount = countNum;
          } else {
            // Si le nombre exact est affiché en texte (ex: "1k")
            countElement.textContent = textLabel.replace('abonnés', '').trim();
            statusElement.textContent = "En direct";
          }
        } else {
          throw new Error("Impossible de trouver le nombre d'abonnés");
        }

      } catch (err) {
        console.error("Erreur d'extraction :", err);
        statusElement.textContent = "Recherche en cours...";
      }
    }

    // Convertit les textes YouTube en nombre pur
    function parseSubCount(text) {
      const cleanText = text.replace(/[^0-9,kM\s]/gi, '').trim().toLowerCase();
      
      let multiplier = 1;
      if (cleanText.includes('k')) multiplier = 1000;
      if (cleanText.includes('m')) multiplier = 1000000;

      const numStr = cleanText.replace(/[^0-9,.]/g, '').replace(',', '.');
      const number = parseFloat(numStr);

      return isNaN(number) ? null : Math.round(number * multiplier);
    }

    function launchConfetti() {
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // Premier appel
    fetchSubscribers();

    // Actualiser toutes les 15 secondes
    setInterval(fetchSubscribers, 15000);
  </script>
</body>
</html>
