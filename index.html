<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Abonnés YouTube</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Effet des bulles en arrière-plan */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .widget-card {
            background: rgba(23, 42, 69, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            text-align: center;
            width: 320px;
            z-index: 10;
        }

        .channel-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .subscriber-count {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 198, 255, 0.3);
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8892b0;
            margin-bottom: 20px;
        }

        .goal-container {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: 12px;
        }

        .goal-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: #a8b2d1;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            height: 100%;
            width: 14%; /* Pourcentage actuel */
            border-radius: 10px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- Quelques bulles décoratives pour retrouver l'ambiance -->
    <div class="bubble" style="width: 60px; height: 60px; top: 15%; left: 20%;"></div>
    <div class="bubble" style="width: 40px; height: 40px; bottom: 20%; right: 25%;"></div>
    <div class="bubble" style="width: 80px; height: 80px; top: 60%; left: 10%;"></div>

    <div class="widget-card">
        <div class="channel-name">@flexplay_officiel</div>
        <div class="subscriber-count" id="subCount">2 144</div>
        <div class="label">Abonnés YouTube</div>
        
        <div class="goal-container">
            <div class="goal-info">
              <span>Objectif : 3 000</span>
              <span>14%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        // Remplace par ton token Streamlabs si tu veux connecter les vraies données en direct
        const STREAMLABS_TOKEN = "TON_TOKEN_ICI";

        // Exemple pour simuler ou mettre à jour dynamiquement si besoin
        function updateSubscribers(newCount) {
            document.getElementById('subCount').innerText = newCount.toLocaleString();
            // Calcul automatique du pourcentage pour l'objectif de 3000 par exemple
            let percentage = Math.min(Math.floor((newCount / 3000) * 100), 100);
            document.querySelector('.goal-info span:last-child').innerText = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }
    </script>
</body>
</html>
