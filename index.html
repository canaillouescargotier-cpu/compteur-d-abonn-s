<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics & Compteur YouTube - @flexplay_officiel</title>

  <!-- Script pour les confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Dégradé bleu */
      background: linear-gradient(135deg, #03045e, #0077b6, #00b4d8);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      align-items: center;
    }

    /* Carte de style néo-morphism/verre */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    /* Carte principale au centre */
    .card.main {
      padding: 40px 30px;
      transform: scale(1.03);
      border: 2px solid rgba(144, 224, 239, 0.4);
    }

    .yt-logo {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #e0f7fa;
    }

    h2 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #caf0f8;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
    }

    .counter {
      font-size: 4.8rem;
      font-weight: 900;
      color: #90e0ef;
      margin: 15px 0;
      text-shadow: 0 0 25px rgba(144, 224, 239, 0.6);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .counter.bump {
      transform: scale(1.15);
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric-box:last-child {
      margin-bottom: 0;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #48cae4;
      margin-top: 5px;
    }

    .metric-label {
      font-size: 0.9rem;
      color: #caf0f8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-badge {
      display: inline-block;
      background: #e63946;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .live-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #90e0ef;
      opacity: 0.8;
    }

    /* Adaptation pour les écrans mobiles */
    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .card.main {
        transform: scale(1);
        order: -1;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- CÔTÉ GAUCHE : ANALYTICS GLOBAUX -->
    <div class="card">
      <h2>Analytics Chaîne</h2>
      
      <div class="metric-box">
        <div class="metric-label">Vues Totales</div>
        <div class="metric-value" id="total-views">...</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Vidéos Publiées</div>
        <div class="metric-value" id="total-videos">...</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Estimation Vues/Jour</div>
        <div class="metric-value" id="daily-views">...</div>
      </div>
    </div>

    <!-- CENTRE : COMPTEUR PRINCIPAL EN DIRECT -->
    <div class="card main">
      <svg class="yt-logo" viewBox="0 0 24 24" fill="#90e0ef">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>

      <h1>@flexplay_officiel</h1>
      <div class="counter" id="subscriber-count">0</div>
      <div class="metric-label">Abonnés YouTube</div>
      <div class="status" id="status-text">Mise à jour en direct...</div>
    </div>

    <!-- CÔTÉ DROIT : LIVE & DERNIÈRE VIDÉO -->
    <div class="card">
      <h2>Live / Dernier Contenu</h2>
      
      <div class="live-badge" id="live-status-tag">Dernier Live / Vidéo</div>
      <div class="live-title" id="live-video-title">Chargement des données...</div>

      <div class="metric-box">
        <div class="metric-label">Vues du contenu</div>
        <div class="metric-value" id="live-views">...</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Likes</div>
        <div class="metric-value" id="live-likes">...</div>
      </div>

      <div class="metric-box">
        <div class="metric-label">Commentaires</div>
        <div class="metric-value" id="live-comments">...</div>
      </div>
    </div>

  </div>

  <script>
    const CHANNEL_ID = 'UCcDHC9MCUe2-5z_vNUzyXEQ'; 
    let previousCount = null;
    let displayedCount = 0;
    let animationInterval = null;

    // Animation fluide pour le compteur principal
    function animateCounter(targetValue) {
      const counterEl = document.getElementById('subscriber-count');
      if (animationInterval) clearInterval(animationInterval);

      const startValue = displayedCount;
      const duration = 1200;
      const frameRate = 30;
      const totalFrames = Math.round(duration / (1000 / frameRate));
      let currentFrame = 0;

      animationInterval = setInterval(() => {
        currentFrame++;
        const progress = currentFrame / totalFrames;
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        
        displayedCount = Math.round(startValue + (targetValue - startValue) * easeProgress);
        counterEl.textContent = displayedCount.toLocaleString('fr-FR');

        if (currentFrame >= totalFrames) {
          clearInterval(animationInterval);
          displayedCount = targetValue;
          counterEl.textContent = targetValue.toLocaleString('fr-FR');
        }
      }, 1000 / frameRate);
    }

    // Récupération des données en direct (Abonnés + Stats globales)
    async function fetchChannelData() {
      const statusElement = document.getElementById('status-text');
      const counterEl = document.getElementById('subscriber-count');

      try {
        const response = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${CHANNEL_ID}`);
        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        
        if (data && data.counts) {
          // 1. Abonnés en direct
          const currentCount = parseInt(data.counts[0].count);
          statusElement.textContent = "● En direct";
          animateCounter(currentCount);

          // Confettis à chaque abonné gagné
          if (previousCount !== null && currentCount > previousCount) {
            launchConfetti();
            counterEl.classList.add('bump');
            setTimeout(() => counterEl.classList.remove('bump'), 300);
          }
          previousCount = currentCount;

          // 2. Stats globales
          if (data.counts[1]) document.getElementById('total-views').textContent = parseInt(data.counts[1].count).toLocaleString('fr-FR');
          if (data.counts[2]) document.getElementById('total-videos').textContent = parseInt(data.counts[2].count).toLocaleString('fr-FR');
          
          // Estimation de vues quotidiennes moyenne
          if (data.counts[1]) {
            const estimatedDaily = Math.round(parseInt(data.counts[1].count) / 365);
            document.getElementById('daily-views').textContent = `~${estimatedDaily.toLocaleString('fr-FR')}`;
          }

        }
      } catch (err) {
        console.error("Erreur stats chaîne :", err);
        statusElement.textContent = "Recherche en cours...";
      }
    }

    // Récupération des stats du dernier contenu/live
    async function fetchLiveAnalytics() {
      try {
        const response = await fetch(`https://socialcounts.org/api/youtube-live-subscriber-count/search/UCcDHC9MCUe2-5z_vNUzyXEQ`);
        const data = await response.json();

        if (data && data.counters) {
          document.getElementById('live-video-title').textContent = "@flexplay_officiel - Flux Actif";
          document.getElementById('live-views').textContent = (data.counters[1] ? data.counters[1].value : 0).toLocaleString('fr-FR');
          document.getElementById('live-likes').textContent = (data.counters[2] ? data.counters[2].value : 0).toLocaleString('fr-FR');
          document.getElementById('live-comments').textContent = (data.counters[3] ? data.counters[3].value : 0).toLocaleString('fr-FR');
        } else {
          document.getElementById('live-video-title').textContent = "Chaîne en ligne";
          document.getElementById('live-views').textContent = "En attente";
          document.getElementById('live-likes').textContent = "En attente";
          document.getElementById('live-comments').textContent = "En attente";
        }
      } catch (err) {
        console.error("Erreur analytics live :", err);
        document.getElementById('live-video-title').textContent = "Dernière session active";
      }
    }

    function launchConfetti() {
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    // Lancement des mises à jour
    fetchChannelData();
    fetchLiveAnalytics();

    // Actualisation automatique toutes les 5 secondes
    setInterval(fetchChannelData, 5000);
    setInterval(fetchLiveAnalytics, 10000);
  </script>
</body>
</html>
